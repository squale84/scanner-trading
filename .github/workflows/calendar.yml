name: Mise à jour du calendrier économique

# Toutes les 30 minutes : récupère le calendrier de la semaine et l'enregistre dans Neon.
# Nécessite le secret DATABASE_URL (Settings > Secrets and variables > Actions) ; sans lui, la
# tâche se termine sans rien faire.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx python-dotenv "psycopg[binary]"
      - run: python update_calendar.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
